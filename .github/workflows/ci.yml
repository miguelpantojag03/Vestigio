name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 22.5+ for node:sqlite, which the storage tests use
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npx eslint src/
      - run: npm run test
      - run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
